name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup local.properties
        run: echo "tmdb.api.key=${{ secrets.TMDB_API_KEY }}" > local.properties

      - name: Build Debug APK for Mobile
        run: ./gradlew :app:assembleDebug

      - name: Build Debug APK for TV
        run: ./gradlew :app-tv:assembleDebug
