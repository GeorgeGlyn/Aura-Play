name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup local.properties
        run: echo "tmdb.api.key=${{ secrets.TMDB_API_KEY }}" > local.properties

      - name: Build Debug APK for Mobile
        run: ./gradlew :app:assembleDebug

      - name: Build Debug APK for TV
        run: ./gradlew :app-tv:assembleDebug

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v3
        with:
          name: app-tv-debug
          path: app-tv/build/outputs/apk/debug/app-tv-debug.apk
